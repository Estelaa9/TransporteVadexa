<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VADEXSA - Portal del Cliente</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f8fafc;
    }
    
    #tms-content-container {
      width: 100%;
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div id="tms-content-container"></div>

  <script type="module">
    import { renderMisServicios, renderProgramacion, renderMisReportes } from './js/modules/portal-cliente.js?v=1.1';
    
    const container = document.getElementById('tms-content-container');
    
    async function handleRoute() {
      const hash = window.location.hash || '#servicios';
      
      container.innerHTML = '<div style="text-align: center; padding: 60px;"><div style="font-size: 14px; color: #94a3b8;">Cargando...</div></div>';
      
      try {
        if (hash === '#servicios' || hash === '') {
          await renderMisServicios(container);
        } else if (hash === '#programacion') {
          await renderProgramacion(container);
        } else if (hash === '#reportes') {
          await renderMisReportes(container);
        }
        
        // Activar navegación después de renderizar
        setTimeout(() => {
          document.querySelectorAll('.portal-nav-item').forEach((item, index) => {
            item.addEventListener('click', function() {
              if (index === 0) window.location.hash = '#servicios';
              else if (index === 1) window.location.hash = '#programacion';
              else if (index === 2) window.location.hash = '#reportes';
            });
          });
        }, 100);
        
      } catch (err) {
        console.error('Error renderizando vista:', err);
        container.innerHTML = `
          <div style="text-align: center; padding: 60px;">
            <div style="color: #ef4444; font-size: 16px; font-weight: 600;">Error al cargar la vista</div>
            <div style="color: #64748b; font-size: 14px; margin-top: 8px;">${err.message}</div>
            <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: #1e40af; color: white; border: none; border-radius: 6px; cursor: pointer;">
              Reintentar
            </button>
          </div>
        `;
      }
    }
    
    window.addEventListener('hashchange', handleRoute);
    handleRoute();
  </script>
</body>
</html>
